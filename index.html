<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/main.css">
    <title>
        Stargazing
    </title>
</head>
<body>
    <section id="main-section">
        <div class="top-element">
            <button id="top-button" onclick="transitionToSection2()">UP</button>
        </div>

        <div class="center-element">
            <div class="info-box">
                <h1>Stargazing Web Application</h1>
                <h3>Information Box</h3>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed dictum luctus nulla. Quisque venenatis odio id metus maximus tincidunt. Praesent dictum pharetra tempus.</p>
            </div>
        </div>

        <div class="bottom-element">
            <button id="bot-button">SETTINGS</button>
        </div>
    </section>

    <section id="stargazing-section">
        <div class="top-element">

        </div>

        <div class="center-element">
            <img id="photo" src="images/aquarius.png" alt="constellation">
            <button id="prev-button" onclick="prevPhoto();">LEFT</button>
            <button id="next-button" onclick="nextPhoto();">RIGHT</button>
        </div>

        <div class="bottom-element">
            <button id="bot-button" onclick="transitionToSection1()">DOWN</button>
        </div>
    </section>

    <script src="script/backgrounds.js"></script>
    <script defer src="script/constellations.js"></script>
</body>
</html>
